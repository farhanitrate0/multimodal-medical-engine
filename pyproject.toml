[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-medical-engine"
version = "3.0.0"
description = "High-throughput ML engine for 3D volumes, biosignals, and streaming telemetry."
authors = [{ name = "Mohd Farhan Ali" }]
requires-python = ">=3.10"
dependencies = [
    "torch==2.4.0", "torchvision==0.19.0", "fastapi==0.111.1", "uvicorn==0.30.1",
    "websockets==13.0", "opencv-python-headless==4.10.0.84", "mediapipe==0.10.14",
    "pillow==10.4.0", "scikit-learn==1.5.1", "nibabel==5.2.1", "plotly==5.22.0",
    "scipy==1.13.1", "numpy==1.26.4", "medmnist==3.0.1"
]

[tool.setuptools]
py-modules = ["biosignal", "gradcam", "main", "medical_volume", "memmap_stream", "model", "train"]